<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Chat Rooms</title>
  <script>
    // ─── GitHub Pages: /chat/<UUID>/ 用のフォールバック ───
    // GitHub Pages は /chat/<UUID>/ のような動的パスの実ディレクトリを
    // 事前に作れないため、存在しないパスはここに来る。
    // /chat/ 配下のパスだけ、UUIDを保存して /chat/ (実ディレクトリ) に飛ばす。
    // それ以外の不明なパスはルームトップへ。
    (function() {
      var path = window.location.pathname;
      var search = window.location.search;

      if (path.indexOf('/chat/') === 0) {
        sessionStorage.setItem('chat-redirect', path + search);
        window.location.replace('/chat/');
      } else {
        window.location.replace('/');
      }
    })();
  </script>
</head>
<body>
  <p>リダイレクト中...</p>
  <a href="/">Chat Rooms へ</a>
</body>
</html>
