<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スレッド作成 - 匿名スレッド</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <header>
    <div class="header-row">
      <h1>💬 匿名スレッド</h1>
    </div>
    <p class="tagline" id="tagline">読み込み中...</p>
    <nav>
      <a href="/" class="nav-btn">板一覧</a>
      <a href="/create/" class="nav-btn active">スレッド作成</a>
      <a href="/join/" class="nav-btn">招待コードで参加</a>
    </nav>
  </header>

  <section class="page active">
    <div class="form-card">
      <h2>🧵 新規スレッド作成</h2>
      <p class="hint">スレッドを作ると、その中でチャットができるようになります。板 → スレッド → チャット。</p>
      <form id="create-form">
        <label>
          <span class="label-text">スレッド名 <small>(必須)</small></span>
          <input type="text" id="room-name" placeholder="例: プログラミング雑談" required>
        </label>

        <label>
          <span class="label-text">板 <small>(ジャンル)</small></span>
          <select id="room-genre">
            <option value="general">💬 雑談 (general)</option>
            <option value="tech">💻 テック (tech)</option>
            <option value="game">🎮 ゲーム (game)</option>
            <option value="music">🎵 音楽 (music)</option>
            <option value="art">🎨 アート (art)</option>
            <option value="study">📚 勉強 (study)</option>
            <option value="hobby">🌿 趣味 (hobby)</option>
            <option value="other">📦 その他 (other)</option>
          </select>
        </label>

        <label>
          <span class="label-text">ハッシュタグ <small>(カンマ区切り)</small></span>
          <input type="text" id="room-hashtags" placeholder="例: #プログラミング, #初心者">
        </label>

        <label>
          <span class="label-text">概要</span>
          <textarea id="room-description" placeholder="スレッドの説明を入力..." rows="3"></textarea>
        </label>

        <label class="checkbox-label">
          <input type="checkbox" id="room-private">
          <span>🔒 プライベートスレッド（招待コードが必要）</span>
        </label>

        <button type="submit" class="btn-primary" id="create-submit">スレッドを立てる</button>
      </form>
      <div id="create-result" class="result-box hidden"></div>
    </div>
  </section>

  <script src="/common.js"></script>
  <script src="/create/create.js"></script>
</body>
</html>
